<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG Splitter</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #09090b;
  color: white;
}

header {
  padding: 24px;
  text-align: center;
  background: linear-gradient(90deg, #ff16a8, #a71cff, #00e8e8);
}

header h1 {
  margin: 0;
  font-size: 34px;
  color: white;
  text-shadow: 2px 2px #000;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

.panel {
  background: #16161b;
  border: 2px solid #ff16a8;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 22px;
}

.drop-zone {
  border: 3px dashed #00e8e8;
  border-radius: 18px;
  padding: 45px 20px;
  text-align: center;
  cursor: pointer;
  transition: .2s;
}

.drop-zone:hover,
.drop-zone.dragover {
  background: #202028;
  border-color: #ff16a8;
}

.drop-zone h2 {
  margin-top: 0;
}

input[type=file] {
  display: none;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
  margin-top: 20px;
}

.control {
  background: #202027;
  padding: 14px;
  border-radius: 12px;
}

.control label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

.control input {
  width: 100%;
}

button {
  border: 0;
  padding: 13px 20px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.primary {
  background: #ff16a8;
  color: white;
}

.secondary {
  background: #00e8e8;
  color: #000;
}

.purple {
  background: #a71cff;
  color: white;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 18px;
}

#originalPreview {
  max-width: 100%;
  max-height: 500px;
  display: block;
  margin: 20px auto 0;
  border-radius: 12px;
}

.results {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
  gap: 18px;
}

.card {
  background: #18181e;
  border: 1px solid #444;
  border-radius: 14px;
  overflow: hidden;
}

.preview {
  padding: 15px;
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;

    linear-gradient(-45deg,#ddd 25%,transparent 25%),
