<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alpha Splitter V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f0ff;color:#241733;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:780px;margin:auto;padding:18px}.card{background:white;border-radius:22px;padding:18px;margin:14px 0}
h1{margin:5px 0}.muted{color:#6e6379}label{display:block;font-weight:800;margin:12px 0 6px}
input,select,button{font:inherit;width:100%;padding:14px;border-radius:14px}input,select{border:1px solid #d8cfe3;background:white}
button{border:0;background:#35204d;color:white;font-weight:800;margin-top:12px}button:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}canvas{width:100%;height:auto;border-radius:14px;background:#eee}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.item{border:1px solid #ded5e8;border-radius:12px;padding:6px;text-align:center}.item img{width:100%;aspect-ratio:1;object-fit:contain}
.item input{padding:7px;text-align:center}.good{font-weight:800;color:#26733c}.warn{font-weight:800;color:#a06400}
</style></head><body><main>
<h1>✨ Alpha Splitter V3</h1>
<p class="muted">For alphabet sheets with transparent or white/light backgrounds.</p>
<div class="card">
<label>Choose alpha image</label><input id="file" type="file" accept="image/*"><p id="chosen" class="muted">No image selected.</p>
<div class="row"><div><label>Labels</label><select id="mode"><option value="upper">A–Z</option><option value="lower">a–z</option><option value="digits">0–9</option></select></div>
<div><label>Padding</label><input id="pad" type="number" min="0" value="12"></div></div>
<label>Background tolerance</label><input id="tol" type="range" min="10" max="120" value="45">
<p class="muted">If letters merge, lower this. If white background remains, raise it.</p>
<button id="split" disabled>Detect & Split</button></div>
<div class="card" id="preview" hidden><canvas id="canvas"></canvas><p id="status"></p></div>
<div class="card" id="results" hidden><div id="grid" class="grid"></div><button id="download">Download Each PNG</button></div>
</main>
<script>
const $=id=>document.getElementById(id);let img=null,parts=[];
$('file').onchange=function(){let f=this.files&&this.files[0];if(!f)return;$('chosen').textContent='Selected: '+f.name;
let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{img=im;$('split').disabled=false;draw([])};im.src=e.target.result};r.readAsDataURL(f)};
function names(){return $('mode').value==='upper'?[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']:$('mode').value==='lower'?[...'abcdefghijklmnopqrstuvwxyz']:[...'0123456789']}
function prep(){let c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
let dat=x.getImageData(0,0,c.width,c.height),d=dat.data,w=c.width,h=c.height, samples=[];
let step=Math.max(1,Math.floor(Math.min(w,h)/100));
function add(px,py){let i=(py*w+px)*4;if(d[i+3]>20)samples.push([d[i],d[i+1],d[i+2]])}
for(let xx=0;xx<w;xx+=step){add(xx,0);add(xx,h-1)}for(let yy=0;yy<h;yy+=step){add(0,yy);add(w-1,yy)}
let avg=k=>samples.length?samples.reduce((s,v)=>s+v[k],0)/samples.length:255,bg=[avg(0),avg(1),avg(2)],tol=+$('tol').value,mask=new Uint8Array(w*h);
for(let p=0;p<w*h;p++){let i=p*4;if(d[i+3]<15)continue;let dr=d[i]-bg[0],dg=d[i+1]-bg[1],db=d[i+2]-bg[2];if(Math.sqrt(dr*dr+dg*dg+db*db)>tol)mask[p]=1}
return {w,h,d,mask}}
function runs(a,min){let out=[],s=-1;for(let i=0;i<=a.length;i++){if(i<a.length&&a[i]&&s<0)s=i;if((i===a.length||!a[i])&&s>=0){if(i-s>=min)out.push([s,i-1]);s=-1}}return out}
function bridge(a,g){let last=-1;for(let i=0;i<a.length;i++)if(a[i]){if(last>=0&&i-last-1<=g)for(let j=last+1;j<i;j++)a[j]=1;last=i}}
function detect(M){let row=new Uint8Array(M.h);for(let y=0;y<M.h;y++){let n=0;for(let x=0;x<M.w;x++)n+=M.mask[y*M.w+x];if(n>M.w*.002)row[y]=1}
bridge(row,Math.max(2,Math.round(M.h*.006)));let rr=runs(row,Math.max(4,Math.round(M.h*.015))),boxes=[];
rr.forEach(R=>{let col=new Uint8Array(M.w);for(let x=0;x<M.w;x++){let n=0;for(let y=R[0];y<=R[1];y++)n+=M.mask[y*M.w+x];if(n>2)col[x]=1}
bridge(col,Math.max(1,Math.round(M.w*.002)));runs(col,Math.max(4,Math.round(M.w*.008))).forEach(C=>boxes.push({x:C[0],y:R[0],w:C[1]-C[0]+1,h:R[1]-R[0]+1}))});return boxes}
function draw(boxes){let c=$('canvas'),x=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;x.drawImage(img,0,0);x.strokeStyle='#ff1684';x.lineWidth=Math.max(2,c.width/500);boxes.forEach(b=>x.strokeRect(b.x,b.y,b.w,b.h));$('preview').hidden=false}
function crop(M,b,p){let x0=Math.max(0,b.x-p),y0=Math.max(0,b.y-p),x1=Math.min(M.w,b.x+b.w+p),y1=Math.min(M.h,b.y+b.h+p),c=document.createElement('canvas');c.width=x1-x0;c.height=y1-y0;
let cx=c.getContext('2d'),o=cx.createImageData(c.width,c.height);for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){let sp=(y+y0)*M.w+x+x0,si=sp*4,di=(y*c.width+x)*4;o.data[di]=M.d[si];o.data[di+1]=M.d[si+1];o.data[di+2]=M.d[si+2];o.data[di+3]=M.mask[sp]?M.d[si+3]:0}cx.putImageData(o,0,0);return c}
$('split').onclick=()=>{let M=prep(),boxes=detect(M),labs=names(),pad=Math.max(0,+$('pad').value||0);draw(boxes);parts=[];$('grid').innerHTML='';
boxes.forEach((b,i)=>{let c=crop(M,b,pad),url=c.toDataURL('image/png'),p={url,name:labs[i]||('piece-'+(i+1))};parts.push(p);let d=document.createElement('div');d.className='item';d.innerHTML='<img src="'+url+'"><input value="'+p.name+'">';d.querySelector('input').oninput=e=>p.name=e.target.value||p.name;$('grid').appendChild(d)});
$('results').hidden=false;$('status').className=boxes.length===labs.length?'good':'warn';$('status').textContent=boxes.length===labs.length?'Perfect — found '+boxes.length+' pieces.':'Found '+boxes.length+' pieces; expected '+labs.length+'. Adjust Background tolerance and try again.'};
$('download').onclick=()=>{parts.forEach((p,i)=>setTimeout(()=>{let a=document.createElement('a');a.href=p.url;a.download=p.name+'.png';document.body.appendChild(a);a.click();a.remove()},i*250));alert('Safari may ask you to allow multiple downloads. Tap Allow.')};
</script></body></html>
