<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PNG Splitter</title>
<style>
:root{--pink:#ff16a8;--teal:#00cfcf;--ink:#17171b;--soft:#f6f6f8}
*{box-sizing:border-box} body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:18px}.hero{text-align:center;padding:18px 8px}.hero h1{margin:0;font-size:clamp(28px,7vw,46px)}
.hero b{color:var(--pink)} .hero p{margin:7px 0;color:#666}
.box{border:2px solid #222;border-radius:18px;padding:16px;margin-bottom:16px;background:#fff;box-shadow:0 5px 18px #00000012}
.drop{border:3px dashed var(--teal);border-radius:16px;padding:34px 15px;text-align:center;cursor:pointer;background:#fbffff}
.drop.drag{background:#eaffff}.btn{appearance:none;border:0;border-radius:12px;padding:13px 17px;font-weight:800;font-size:16px;cursor:pointer}
.pink{background:var(--pink);color:#fff}.teal{background:var(--teal);color:#071818}.dark{background:#222;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
label{font-weight:750;display:block;margin-bottom:5px} input[type=number],select{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;font-size:16px}
#source{display:none;max-width:100%;max-height:360px;margin:15px auto 0;border-radius:12px}.status{font-weight:700;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid #ddd;border-radius:14px;overflow:hidden;background:#fff}.preview{height:155px;display:flex;align-items:center;justify-content:center;
background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img{max-width:92%;max-height:92%}.info{padding:10px}.info button{width:100%;margin-top:8px}
.note{font-size:13px;color:#666}.hide{display:none!important}
</style>
</head>
<body>
<main>
<section class="hero"><h1>✂️ <b>PNG</b> Splitter</h1><p>Standalone • mobile friendly • full-resolution exports</p></section>
<section class="box">
  <div id="drop" class="drop">
    <strong>Tap to choose a PNG</strong><br><span class="note">or drag & drop on desktop</span>
    <input id="file" type="file" accept="image/png,image/*" hidden>
  </div>
  <img id="source" alt="Source preview">
  <div class="controls">
    <div><label for="mode">Background</label><select id="mode"><option value="transparent">Transparent</option><option value="white">White / near-white</option></select></div>
    <div><label for="pad">Padding (px)</label><input id="pad" type="number" min="0" max="1000" value="40"></div>
    <div><label for="min">Minimum piece size</label><input id="min" type="number" min="5" max="1000" value="35"></div>
  </div>
  <div class="actions">
    <button id="split" class="btn pink">Split PNG</button>
    <button id="all" class="btn teal hide">Download All</button>
    <button id="clear" class="btn dark">Clear</button>
  </div>
  <div id="status" class="status"></div>
  <p class="note">Detection uses a small working copy so large 5000×5000 sheets don't freeze your phone. Downloads are cropped from the original image.</p>
</section>
<section id="results" class="grid"></section>
<canvas id="scan" class="hide"></canvas>
</main>
<script>
const $=id=>document.getElementById(id);
const file=$('file'),drop=$('drop'),source=$('source'),status=$('status'),results=$('results'),all=$('all');
let img=null,pieces=[];
drop.onclick=()=>file.click();
file.onchange=()=>file.files[0]&&load(file.files[0]);
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));
drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&load(e.dataTransfer.files[0]));
function load(f){
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{img=im;source.src=u;source.style.display='block';status.textContent=`Loaded ${im.naturalWidth} × ${im.naturalHeight}px`;results.innerHTML='';all.classList.add('hide')};
 im.onerror=()=>status.textContent='Could not open that image.'; im.src=u;
}
$('clear').onclick=()=>{img=null;pieces=[];file.value='';source.style.display='none';source.removeAttribute('src');results.innerHTML='';status.textContent='';all.classList.add('hide')};
$('split').onclick=async()=>{
 if(!img){status.textContent='Choose an image first.';return}
 status.textContent='Finding pieces…'; results.innerHTML=''; pieces=[]; all.classList.add('hide');
 await new Promise(r=>setTimeout(r,30));
 const maxSide=900,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
 const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
 const c=$('scan');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,w,h);x.drawImage(img,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,mask=new Uint8Array(w*h),mode=$('mode').value;
 for(let i=0,p=0;i<d.length;i+=4,p++){const a=d[i+3];mask[p]=mode==='transparent'?(a>24):(a>24&&(d[i]<245||d[i+1]<245||d[i+2]<245));}
 // Morphological bridge: joins tiny gaps inside one clipart without merging normally spaced items.
 const dil=new Uint8Array(mask);
 for(let y=1;y<h-1;y++)for(let x0=1;x0<w-1;x0++){let p=y*w+x0;if(mask[p]){dil[p-1]=dil[p+1]=dil[p-w]=dil[p+w]=1}}
 const seen=new Uint8Array(w*h), comps=[], minDim=Math.max(3,Math.round(Number($('min').value)*scale));
 for(let y=0;y<h;y++)for(let x0=0;x0<w;x0++){let s=y*w+x0;if(!dil[s]||seen[s])continue;
   let stack=[s],minx=x0,maxx=x0,miny=y,maxy=y,count=0;seen[s]=1;
   while(stack.length){let p=stack.pop(),py=Math.floor(p/w),px=p-py*w;count++;if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;
     if(px>0){let q=p-1;if(dil[q]&&!seen[q]){seen[q]=1;stack.push(q)}} if(px<w-1){let q=p+1;if(dil[q]&&!seen[q]){seen[q]=1;stack.push(q)}}
     if(py>0){let q=p-w;if(dil[q]&&!seen[q]){seen[q]=1;stack.push(q)}} if(py<h-1){let q=p+w;if(dil[q]&&!seen[q]){seen[q]=1;stack.push(q)}}
   }
   if((maxx-minx+1)>=minDim&&(maxy-miny+1)>=minDim) comps.push({minx,miny,maxx,maxy});
 }
 comps.sort((a,b)=>Math.abs(a.miny-b.miny)>Math.max(12,minDim)?a.miny-b.miny:a.minx-b.minx);
 const pad=Number($('pad').value)||0,inv=1/scale;
 comps.forEach((b,i)=>{
   let sx=Math.max(0,Math.floor(b.minx*inv-pad)),sy=Math.max(0,Math.floor(b.miny*inv-pad));
   let ex=Math.min(img.naturalWidth,Math.ceil((b.maxx+1)*inv+pad)),ey=Math.min(img.naturalHeight,Math.ceil((b.maxy+1)*inv+pad));
   let cw=ex-sx,ch=ey-sy,pc=document.createElement('canvas');pc.width=cw;pc.height=ch;
   pc.getContext('2d').drawImage(img,sx,sy,cw,ch,0,0,cw,ch);
   pieces.push({canvas:pc,name:`clipart-${String(i+1).padStart(2,'0')}.png`}); addCard(pc,i,cw,ch);
 });
 status.textContent=pieces.length?`Found ${pieces.length} piece${pieces.length===1?'':'s'}.`:'No separate pieces found. Try the other Background setting or lower Minimum piece size.';
 if(pieces.length)all.classList.remove('hide');
};
function addCard(c,i,w,h){
 const card=document.createElement('div');card.className='card';const pv=document.createElement('div');pv.className='preview';const im=document.createElement('img');im.src=c.toDataURL('image/png');pv.appendChild(im);
 const inf=document.createElement('div');inf.className='info';inf.innerHTML=`<strong>Piece ${i+1}</strong><div class="note">${w} × ${h}px</div>`;
 const b=document.createElement('button');b.className='btn pink';b.textContent='Download PNG';b.onclick=()=>download(i);inf.appendChild(b);card.append(pv,inf);results.appendChild(card);
}
function download(i){pieces[i].canvas.toBlob(blob=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=pieces[i].name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png')}
all.onclick=async()=>{for(let i=0;i<pieces.length;i++){download(i);await new Promise(r=>setTimeout(r,350))}};
</script>
</body>
</html>
