<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PNG Splitter — Grid Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#18181b;font-family:system-ui,-apple-system,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:18px}h1{text-align:center;margin:10px 0 4px;font-size:36px}h1 span{color:#ff16a8}
.sub{text-align:center;color:#666;margin:0 0 18px}.box{border:2px solid #222;border-radius:18px;padding:16px;margin-bottom:18px}
.drop{border:3px dashed #00cfcf;border-radius:15px;text-align:center;padding:30px 12px;font-weight:800;cursor:pointer}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
label{font-weight:800;font-size:14px}input{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;font-size:16px;margin-top:5px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800}
.pink{background:#ff16a8;color:#fff}.teal{background:#00d8d8;color:#071818}.dark{background:#222;color:#fff}
#source{display:none;margin:15px auto 0}.source-thumb{max-width:100%;max-height:180px;margin:auto;display:block;border:1px solid #ddd;border-radius:8px}
.sheet-settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.sheet-card{border:1px solid #ddd;border-radius:14px;padding:10px;background:#fafafa}
.sheet-card .sheet-name{font-weight:800;word-break:break-word;margin:7px 0}
.sheet-grid-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-grid-controls input{padding:8px}.status{font-weight:800;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:14px;overflow:hidden}
.preview{height:160px;display:flex;align-items:center;justify-content:center;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img{max-width:92%;max-height:92%}.info{padding:10px}.info button{width:100%;margin-top:8px}.hide{display:none}.note{font-size:13px;color:#666}
.adjust{margin-top:10px;border-top:1px solid #e5e5e5;padding-top:9px}.adjust label{display:block;font-size:12px;margin:7px 0}.adjust input[type=range]{padding:0;margin-top:3px}.adjust input[type=text]{padding:8px;margin-top:3px}.value{float:right;color:#666;font-weight:700}.reset{background:#eee;color:#222}
@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}h1{font-size:30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body><main>
<h1>✂️ <span>PNG</span> Splitter</h1>
<p class="sub">Grid splitter — one bead per file</p>
<section class="box">
<div id="drop" class="drop">Tap to choose one or multiple PNGs<input id="file" type="file" accept="image/*" multiple hidden></div>
<div id="source" style="display:none"></div>
<div class="controls">
<div><label>Items<input id="items" type="number" min="1" max="200" value="26"></label></div>
<div><label>Outer margin %<input id="margin" type="number" min="0" max="30" step=".5" value="2"></label></div>
<div><label>Gap trim %<input id="gap" type="number" min="0" max="45" step=".5" value="10"></label></div>
<div><label>Extra padding px<input id="pad" type="number" min="0" max="500" value="20"></label></div>
</div>
<div style="margin-top:14px">
<label>ZIP File Name
<input id="zipName" type="text" value="alpha-splitter" placeholder="Example: Christmas Alphabet">
</label>
</div>
<div class="actions"><button id="split" class="pink">Split Into Pieces</button><button id="autoAlign" class="teal hide">Auto Align &amp; Size</button><button id="all" class="teal hide">Download All as ZIP</button><button id="clear" class="dark">Clear</button></div>
<div id="status" class="status"></div>
<p class="note">Each uploaded photo now has its own Rows and Columns settings underneath it. Use 6 columns × 5 rows for a standard 26-letter alphabet sheet, or change each photo independently.</p>
</section>
<section id="results" class="grid"></section>
</main>
<script>
const $=x=>document.getElementById(x),file=$('file'),drop=$('drop'),source=$('source'),results=$('results'),status=$('status'),all=$('all');
let images=[],pieces=[];

drop.onclick=()=>file.click();
file.onchange=()=>file.files.length&&loadFiles([...file.files]);

async function loadFiles(files){
  images=[];pieces=[];results.innerHTML='';source.innerHTML='';all.classList.add('hide');$('autoAlign').classList.add('hide');
  const valid=files.filter(f=>f.type.startsWith('image/'));
  const settingsWrap=document.createElement('div');
  settingsWrap.className='sheet-settings';
  source.appendChild(settingsWrap);

  for(const f of valid){
    const data=await loadOne(f);
    data.cols=6;
    data.rows=5;
    images.push(data);
    const idx=images.length-1;

    const card=document.createElement('div');
    card.className='sheet-card';

    const thumb=document.createElement('img');
    thumb.className='source-thumb';thumb.src=data.url;thumb.alt=f.name;

    const nm=document.createElement('div');
    nm.className='sheet-name';nm.textContent=f.name;

    const controls=document.createElement('div');
    controls.className='sheet-grid-controls';

    const colLab=document.createElement('label');
    colLab.textContent='Columns';
    const col=document.createElement('input');
    col.type='number';col.min='1';col.max='20';col.value='6';
    col.addEventListener('input',()=>{data.cols=Math.max(1,Math.min(20,+col.value||1))});
    colLab.appendChild(col);

    const rowLab=document.createElement('label');
    rowLab.textContent='Rows';
    const row=document.createElement('input');
    row.type='number';row.min='1';row.max='20';row.value='5';
    row.addEventListener('input',()=>{data.rows=Math.max(1,Math.min(20,+row.value||1))});
    rowLab.appendChild(row);

    controls.append(colLab,rowLab);
    card.append(thumb,nm,controls);
    settingsWrap.appendChild(card);
  }
  source.style.display=images.length?'block':'none';
  status.textContent=images.length?`Loaded ${images.length} image${images.length===1?'':'s'}. Set rows and columns under each photo, then split.`:'No valid images selected.';
}
function loadOne(f){
  return new Promise((resolve,reject)=>{
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>resolve({img:im,url:u,fileName:f.name.replace(/\.[^.]+$/,'')});
    im.onerror=reject;im.src=u;
  });
}

$('clear').onclick=()=>{
  images.forEach(x=>URL.revokeObjectURL(x.url));
  images=[];pieces=[];file.value='';source.innerHTML='';source.style.display='none';
  results.innerHTML='';status.textContent='';all.classList.add('hide');$('autoAlign').classList.add('hide')
};

$('split').onclick=()=>{
  if(!images.length){status.textContent='Choose one or more PNGs first.';return}
  pieces=[];results.innerHTML='';
  const requestedItems=+$('items').value,
        marginPct=+$('margin').value/100,gapPct=+$('gap').value/100,pad=+$('pad').value;

  images.forEach((sourceItem,sheetIndex)=>{
    const cols=sourceItem.cols||6,rows=sourceItem.rows||5,total=Math.min(requestedItems,cols*rows),
          img=sourceItem.img,W=img.naturalWidth,H=img.naturalHeight,
          mx=W*marginPct,my=H*marginPct,usableW=W-2*mx,usableH=H-2*my,cw=usableW/cols,ch=usableH/rows;

    const heading=document.createElement('div');
    heading.style.gridColumn='1 / -1';
    heading.innerHTML=`<h2 style="margin:10px 0 0">${escapeHtml(sourceItem.fileName)}</h2><div class="note">Upload ${sheetIndex+1} of ${images.length}</div>`;
    results.appendChild(heading);

    for(let i=0;i<total;i++){
      let r=Math.floor(i/cols),c=i%cols;
      let trimX=cw*gapPct/2,trimY=ch*gapPct/2;
      let sx=Math.max(0,Math.floor(mx+c*cw+trimX-pad)),sy=Math.max(0,Math.floor(my+r*ch+trimY-pad));
      let ex=Math.min(W,Math.ceil(mx+(c+1)*cw-trimX+pad)),ey=Math.min(H,Math.ceil(my+(r+1)*ch-trimY+pad));
      let w=ex-sx,h=ey-sy;
      let base=document.createElement('canvas');base.width=w;base.height=h;
      base.getContext('2d').drawImage(img,sx,sy,w,h,0,0,w,h);
      let letter=i<26?String.fromCharCode(65+i):`Piece-${i+1}`;
      let defaultName=images.length>1?`${sourceItem.fileName}-${letter}.png`:`${letter}.png`;
      let pieceIndex=pieces.length;
      pieces.push({base,canvas:null,name:defaultName,x:0,y:0,zoom:100,sheet:sheetIndex,letter});
      renderPiece(pieceIndex);
      card(pieceIndex,w,h);
    }
  });
  status.textContent=`Created ${pieces.length} pieces from ${images.length} image${images.length===1?'':'s'}.`;
  all.classList.remove('hide');$('autoAlign').classList.remove('hide');
};

function renderPiece(i){
  const pc=pieces[i],base=pc.base;
  let can=document.createElement('canvas');can.width=base.width;can.height=base.height;
  let ctx=can.getContext('2d');ctx.clearRect(0,0,can.width,can.height);
  const scale=pc.zoom/100,dw=base.width*scale,dh=base.height*scale,
        dx=(can.width-dw)/2+pc.x,dy=(can.height-dh)/2+pc.y;
  ctx.drawImage(base,dx,dy,dw,dh);pc.canvas=can;
  const preview=document.querySelector(`[data-preview="${i}"]`);
  if(preview) preview.src=can.toDataURL('image/png');
}

function card(i,w,h){
  const pc=pieces[i];
  let d=document.createElement('div');d.className='card';
  let p=document.createElement('div');p.className='preview';
  let im=document.createElement('img');im.dataset.preview=i;im.src=pc.canvas.toDataURL('image/png');p.appendChild(im);
  let info=document.createElement('div');info.className='info';
  let title=document.createElement('b');title.textContent=pc.letter;
  let dims=document.createElement('div');dims.className='note';dims.textContent=`${w} × ${h}px`;
  info.append(title,dims);
  let adjust=document.createElement('div');adjust.className='adjust';

  let nameLab=document.createElement('label');nameLab.textContent='Rename';
  let name=document.createElement('input');name.type='text';name.value=pc.name.replace(/\.png$/i,'');
  name.dataset.autoClear='1';
  name.addEventListener('focus',()=>{
    if(name.dataset.autoClear==='1'){
      name.value='';
      name.dataset.autoClear='0';
      pc.name=`Piece-${i+1}.png`;
    }
  });
  name.addEventListener('input',()=>{
    name.dataset.autoClear='0';
    pc.name=(name.value.trim()||`Piece-${i+1}`)+'.png'
  });
  nameLab.appendChild(name);adjust.appendChild(nameLab);

  adjust.appendChild(makeSlider(i,'Left / Right','x',-Math.max(100,w),Math.max(100,w),1,0,'px'));
  adjust.appendChild(makeSlider(i,'Up / Down','y',-Math.max(100,h),Math.max(100,h),1,0,'px'));
  adjust.appendChild(makeSlider(i,'Zoom','zoom',25,300,1,100,'%'));

  let reset=document.createElement('button');reset.type='button';reset.className='reset';reset.textContent='Reset This Letter';
  reset.onclick=()=>{
    pc.x=0;pc.y=0;pc.zoom=100;
    adjust.querySelectorAll('input[type=range]').forEach(r=>{
      const key=r.dataset.key;r.value=pc[key];
      r.parentElement.querySelector('.value').textContent=r.value+(key==='zoom'?'%':'px');
    });renderPiece(i)
  };
  adjust.appendChild(reset);
  let b=document.createElement('button');b.className='pink';b.textContent='Download PNG';b.onclick=()=>dl(i);
  info.append(adjust,b);d.append(p,info);results.appendChild(d)
}

function makeSlider(i,label,key,min,max,step,value,unit){
  let lab=document.createElement('label'),txt=document.createElement('span'),val=document.createElement('span'),r=document.createElement('input');
  txt.textContent=label;val.className='value';val.textContent=value+unit;
  r.type='range';r.min=min;r.max=max;r.step=step;r.value=value;r.dataset.key=key;
  r.addEventListener('input',()=>{pieces[i][key]=+r.value;val.textContent=r.value+unit;renderPiece(i)});
  lab.append(txt,val,r);return lab
}


function alphaBounds(canvas){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  const data=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(data[(y*w+x)*4+3]>12){
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return null;
  return {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
}

function autoAlignAndSize(){
  if(!pieces.length){status.textContent='Split your images first.';return}
  const bounds=pieces.map(p=>alphaBounds(p.base));
  const valid=bounds.filter(Boolean);
  if(!valid.length){status.textContent='No visible artwork detected.';return}

  // Normalize visible artwork to roughly 78% of each output cell.
  const targetFill=.78;
  pieces.forEach((pc,i)=>{
    const b=bounds[i];
    if(!b)return;
    const cw=pc.base.width,ch=pc.base.height;
    const scale=Math.min((cw*targetFill)/b.w,(ch*targetFill)/b.h);
    pc.zoom=Math.max(25,Math.min(300,scale*100));

    // renderPiece scales the whole base around its center. Calculate offsets
    // needed to put the visible alpha bounds at the exact output center.
    const s=pc.zoom/100;
    const baseCenterX=cw/2,baseCenterY=ch/2;
    const artCenterX=b.x+b.w/2,artCenterY=b.y+b.h/2;
    pc.x=(baseCenterX-artCenterX)*s;
    pc.y=(baseCenterY-artCenterY)*s;

    renderPiece(i);

    const card=document.querySelector(`[data-preview="${i}"]`)?.closest('.card');
    if(card){
      card.querySelectorAll('input[type=range]').forEach(r=>{
        const key=r.dataset.key;
        if(key && key in pc){
          r.value=pc[key];
          const v=r.parentElement.querySelector('.value');
          if(v)v.textContent=Math.round(pc[key])+(key==='zoom'?'%':'px');
        }
      });
    }
  });
  status.textContent=`Auto-aligned and sized ${valid.length} piece${valid.length===1?'':'s'}. You can still fine-tune each one manually.`;
}

function dl(i){
  pieces[i].canvas.toBlob(blob=>{
    let u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=pieces[i].name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000)
  },'image/png')
}

$('autoAlign').onclick=autoAlignAndSize;

all.onclick=async()=>{
  if(!pieces.length){status.textContent='Nothing to download yet.';return}
  if(typeof JSZip==='undefined'){
    status.textContent='ZIP download could not load. Check your internet connection and try again.';
    return;
  }
  all.disabled=true;
  const oldText=all.textContent;
  all.textContent='Making ZIP…';
  status.textContent=`Preparing ${pieces.length} PNGs in one ZIP file…`;
  try{
    const zip=new JSZip();
    for(let i=0;i<pieces.length;i++){
      const blob=await new Promise(resolve=>pieces[i].canvas.toBlob(resolve,'image/png'));
      let name=pieces[i].name || `Piece-${i+1}.png`;
      zip.file(name,blob);
    }
    const zipBlob=await zip.generateAsync({type:'blob'});
    const u=URL.createObjectURL(zipBlob),a=document.createElement('a');
    a.href=u;
    let zipName=($('zipName').value||'alpha-splitter').trim()
      .replace(/\.zip$/i,'')
      .replace(/[\\/:*?"<>|]+/g,'-')
      .replace(/\s+/g,' ')
      .trim() || 'alpha-splitter';
    a.download=zipName+'.zip';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    status.textContent=`Downloaded ${pieces.length} PNGs as one ZIP file.`;
  }catch(err){
    console.error(err);
    status.textContent='Could not create the ZIP. Please try again.';
  }finally{
    all.disabled=false;
    all.textContent=oldText;
  }
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
</script></body></html>
