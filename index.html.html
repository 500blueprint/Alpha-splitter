<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PNG Splitter — Grid Mode</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#18181b;font-family:system-ui,-apple-system,Arial,sans-serif}
main{max-width:980px;margin:auto;padding:18px}h1{text-align:center;margin:10px 0 4px;font-size:36px}h1 span{color:#ff16a8}
.sub{text-align:center;color:#666;margin:0 0 18px}.box{border:2px solid #222;border-radius:18px;padding:16px;margin-bottom:18px}
.drop{border:3px dashed #00cfcf;border-radius:15px;text-align:center;padding:30px 12px;font-weight:800;cursor:pointer}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
label{font-weight:800;font-size:14px}input{width:100%;padding:11px;border:1px solid #bbb;border-radius:10px;font-size:16px;margin-top:5px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800}
.pink{background:#ff16a8;color:#fff}.teal{background:#00d8d8;color:#071818}.dark{background:#222;color:#fff}
#source{display:none;margin:15px auto 0}.source-thumb{max-width:100%;max-height:180px;margin:auto;display:block;border:1px solid #ddd;border-radius:8px}
.sheet-settings{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:12px}
.sheet-card{border:1px solid #ddd;border-radius:14px;padding:10px;background:#fafafa}
.sheet-card .sheet-name{font-weight:800;word-break:break-word;margin:7px 0}
.sheet-grid-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row-pattern{grid-column:1/-1}
.sheet-grid-controls input{padding:8px}.status{font-weight:800;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{border:1px solid #ddd;border-radius:14px;overflow:hidden}
.preview{height:160px;display:flex;align-items:center;justify-content:center;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.preview img{max-width:92%;max-height:92%}.info{padding:10px}.info button{width:100%;margin-top:8px}.hide{display:none}.note{font-size:13px;color:#666}
.adjust{margin-top:10px;border-top:1px solid #e5e5e5;padding-top:9px}.adjust label{display:block;font-size:12px;margin:7px 0}.adjust input[type=range]{padding:0;margin-top:3px}.adjust input[type=text]{padding:8px;margin-top:3px}.value{float:right;color:#666;font-weight:700}.reset{background:#eee;color:#222}
@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}h1{font-size:30px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body><main>
<h1>✂️ <span>PNG</span> Splitter</h1>
<p class="sub">Grid splitter • automatic no-cutoff full-letter recovery • 5000 × 5000 PNG • 500 DPI</p>
<section class="box">
<div id="drop" class="drop">Tap to choose one or multiple PNGs<input id="file" type="file" accept="image/*" multiple hidden></div>
<div id="source" style="display:none"></div>
<div class="controls">
<div><label>Items<input id="items" type="number" min="1" max="200" value="26"></label></div>
<div><label>Outer margin %<input id="margin" type="number" min="0" max="30" step=".5" value="2"></label></div>
<div><label>Gap trim %<input id="gap" type="number" min="0" max="45" step=".5" value="10"></label></div>
<div><label>Extra padding px<input id="pad" type="number" min="0" max="500" value="20"></label></div>
</div>
<div style="margin-top:14px">
<label>ZIP File Name
<input id="zipName" type="text" value="alpha-splitter" placeholder="Example: Christmas Alphabet">
</label>
</div>
<div class="actions"><button id="split" class="pink">Split Into Pieces</button><button id="autoAlign" class="teal hide">Auto Align &amp; Size</button><button id="all" class="teal hide">Download All as ZIP</button><button id="clear" class="dark">Clear</button></div>
<div id="status" class="status"></div>
<p class="note">Each uploaded photo has its own layout. Use regular Rows and Columns, or enter different column counts per row such as 9,9,8 for a 26-letter sheet.</p>
</section>
<section id="results" class="grid"></section>
</main>
<script>
const $=x=>document.getElementById(x),file=$('file'),drop=$('drop'),source=$('source'),results=$('results'),status=$('status'),all=$('all');
let images=[],pieces=[];

drop.onclick=()=>file.click();
file.onchange=()=>file.files.length&&loadFiles([...file.files]);

async function loadFiles(files){
  images=[];pieces=[];results.innerHTML='';source.innerHTML='';all.classList.add('hide');$('autoAlign').classList.add('hide');
  const valid=files.filter(f=>f.type.startsWith('image/'));
  const settingsWrap=document.createElement('div');
  settingsWrap.className='sheet-settings';
  source.appendChild(settingsWrap);

  for(const f of valid){
    const data=await loadOne(f);
    data.cols=6;
    data.rows=5;
    data.rowPattern=[];
    images.push(data);
    const idx=images.length-1;

    const card=document.createElement('div');
    card.className='sheet-card';

    const thumb=document.createElement('img');
    thumb.className='source-thumb';thumb.src=data.url;thumb.alt=f.name;

    const nm=document.createElement('div');
    nm.className='sheet-name';nm.textContent=f.name;

    const controls=document.createElement('div');
    controls.className='sheet-grid-controls';

    const colLab=document.createElement('label');
    colLab.textContent='Columns';
    const col=document.createElement('input');
    col.type='number';col.min='1';col.max='20';col.value='6';
    col.addEventListener('input',()=>{data.cols=Math.max(1,Math.min(20,+col.value||1))});
    colLab.appendChild(col);

    const rowLab=document.createElement('label');
    rowLab.textContent='Rows';
    const row=document.createElement('input');
    row.type='number';row.min='1';row.max='20';row.value='5';
    row.addEventListener('input',()=>{data.rows=Math.max(1,Math.min(20,+row.value||1))});
    rowLab.appendChild(row);

    const patLab=document.createElement('label');patLab.className='row-pattern';patLab.textContent='Columns per row (optional)';
    const pat=document.createElement('input');pat.type='text';pat.placeholder='Example: 9,9,8';
    pat.addEventListener('input',()=>{data.rowPattern=pat.value.split(',').map(v=>parseInt(v.trim(),10)).filter(v=>v>0&&v<=50);if(data.rowPattern.length){data.rows=data.rowPattern.length;row.value=data.rows;}});
    patLab.appendChild(pat);
    controls.append(colLab,rowLab,patLab);
    card.append(thumb,nm,controls);
    settingsWrap.appendChild(card);
  }
  source.style.display=images.length?'block':'none';
  status.textContent=images.length?`Loaded ${images.length} image${images.length===1?'':'s'}. Set rows and columns under each photo, then split.`:'No valid images selected.';
}
function loadOne(f){
  return new Promise((resolve,reject)=>{
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>resolve({img:im,url:u,fileName:f.name.replace(/\.[^.]+$/,'')});
    im.onerror=reject;im.src=u;
  });
}

$('clear').onclick=()=>{
  images.forEach(x=>URL.revokeObjectURL(x.url));
  images=[];pieces=[];file.value='';source.innerHTML='';source.style.display='none';
  results.innerHTML='';status.textContent='';all.classList.add('hide');$('autoAlign').classList.add('hide')
};

$('split').onclick=()=>{
  if(!images.length){status.textContent='Choose one or more PNGs first.';return}
  pieces=[];results.innerHTML='';
  const requestedItems=+$('items').value,
        marginPct=+$('margin').value/100,gapPct=+$('gap').value/100,pad=+$('pad').value;

  images.forEach((sourceItem,sheetIndex)=>{
    const cols=sourceItem.cols||6,pattern=(sourceItem.rowPattern&&sourceItem.rowPattern.length)?sourceItem.rowPattern:null;
    const rows=pattern?pattern.length:(sourceItem.rows||5),capacity=pattern?pattern.reduce((a,b)=>a+b,0):cols*rows,total=Math.min(requestedItems,capacity);
    const img=sourceItem.img,W=img.naturalWidth,H=img.naturalHeight,mx=W*marginPct,my=H*marginPct,usableW=W-2*mx,usableH=H-2*my,ch=usableH/rows;

    const heading=document.createElement('div');heading.style.gridColumn='1 / -1';
    const layoutText=pattern?`Rows: ${pattern.join(', ')}`:`${cols} columns × ${rows} rows`;
    heading.innerHTML=`<h2 style="margin:10px 0 0">${escapeHtml(sourceItem.fileName)}</h2><div class="note">Upload ${sheetIndex+1} of ${images.length} • ${layoutText}</div>`;
    results.appendChild(heading);

    let i=0;
    for(let r=0;r<rows&&i<total;r++){
      const rowCols=pattern?pattern[r]:cols,cw=usableW/rowCols;
      for(let c=0;c<rowCols&&i<total;c++,i++){
        let trimX=cw*gapPct/2,trimY=ch*gapPct/2;
        let sx=Math.max(0,Math.floor(mx+c*cw+trimX-pad)),sy=Math.max(0,Math.floor(my+r*ch+trimY-pad));
        let ex=Math.min(W,Math.ceil(mx+(c+1)*cw-trimX+pad)),ey=Math.min(H,Math.ceil(my+(r+1)*ch-trimY-pad));
        const recovered=autoRecoverFullCrop(img,sx,sy,ex,ey);
        sx=recovered.sx;sy=recovered.sy;ex=recovered.ex;ey=recovered.ey;
        let w=ex-sx,h=ey-sy,base=document.createElement('canvas');base.width=w;base.height=h;
        base.getContext('2d').drawImage(img,sx,sy,w,h,0,0,w,h);
        let letter=i<26?String.fromCharCode(65+i):`Piece-${i+1}`,defaultName=images.length>1?`${sourceItem.fileName}-${letter}.png`:`${letter}.png`,pieceIndex=pieces.length;
        let original=document.createElement('canvas');original.width=w;original.height=h;original.getContext('2d').drawImage(base,0,0);
        pieces.push({
          base,original,canvas:null,name:defaultName,x:0,y:0,zoom:100,sheet:sheetIndex,letter,
          cropL:0,cropR:0,cropT:0,cropB:0,
          sourceImg:img,sourceX:sx,sourceY:sy,sourceW:w,sourceH:h,
          recoverX:0,recoverY:0,recoverGrow:0,autoRecovered:recovered.recovered
        });
        renderPiece(pieceIndex);card(pieceIndex,w,h);
      }
    }
  });
  status.textContent=`Created ${pieces.length} pieces from ${images.length} image${images.length===1?'':'s'}.`;
  all.classList.remove('hide');$('autoAlign').classList.remove('hide');
};

function autoRecoverFullCrop(img,sx,sy,ex,ey){
  const W=img.naturalWidth,H=img.naturalHeight;
  // Work on a scaled copy of the ORIGINAL sheet so edge detection is fast on phones.
  const maxDim=1400,scale=Math.min(1,maxDim/Math.max(W,H));
  const sw=Math.max(1,Math.round(W*scale)),sh=Math.max(1,Math.round(H*scale));
  const scan=document.createElement('canvas');scan.width=sw;scan.height=sh;
  const ctx=scan.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,sw,sh);
  const data=ctx.getImageData(0,0,sw,sh).data;
  const alpha=(x,y)=>data[(Math.max(0,Math.min(sh-1,y))*sw+Math.max(0,Math.min(sw-1,x)))*4+3];

  let l=Math.max(0,Math.floor(sx*scale)),t=Math.max(0,Math.floor(sy*scale));
  let r=Math.min(sw-1,Math.ceil(ex*scale)-1),b=Math.min(sh-1,Math.ceil(ey*scale)-1);
  const originalW=Math.max(1,r-l+1),originalH=Math.max(1,b-t+1);
  const maxGrowX=Math.round(originalW*.48),maxGrowY=Math.round(originalH*.48);
  const strip=Math.max(2,Math.round(Math.min(originalW,originalH)*.025));
  const threshold=12;

  function edgeHasArt(side){
    let hits=0,total=0;
    if(side==='left'||side==='right'){
      const x=side==='left'?l:r;
      for(let y=t;y<=b;y+=2){
        total++;
        for(let d=0;d<strip;d++){
          const xx=side==='left'?x+d:x-d;
          if(alpha(xx,y)>threshold){hits++;break}
        }
      }
    }else{
      const y=side==='top'?t:b;
      for(let x=l;x<=r;x+=2){
        total++;
        for(let d=0;d<strip;d++){
          const yy=side==='top'?y+d:y-d;
          if(alpha(x,yy)>threshold){hits++;break}
        }
      }
    }
    return total>0 && hits/total>.012;
  }

  let gl=0,gr=0,gt=0,gb=0,guard=0;
  while(edgeHasArt('left') && l>0 && gl<maxGrowX && guard++<200){l=Math.max(0,l-strip);gl+=strip}
  guard=0;
  while(edgeHasArt('right') && r<sw-1 && gr<maxGrowX && guard++<200){r=Math.min(sw-1,r+strip);gr+=strip}
  guard=0;
  while(edgeHasArt('top') && t>0 && gt<maxGrowY && guard++<200){t=Math.max(0,t-strip);gt+=strip}
  guard=0;
  while(edgeHasArt('bottom') && b<sh-1 && gb<maxGrowY && guard++<200){b=Math.min(sh-1,b+strip);gb+=strip}

  // Add a small clear safety margin after the artwork stops touching the boundary.
  const safe=Math.max(2,Math.round(Math.min(originalW,originalH)*.025));
  if(gl)l=Math.max(0,l-safe); if(gr)r=Math.min(sw-1,r+safe);
  if(gt)t=Math.max(0,t-safe); if(gb)b=Math.min(sh-1,b+safe);

  return {
    sx:Math.max(0,Math.floor(l/scale)),
    sy:Math.max(0,Math.floor(t/scale)),
    ex:Math.min(W,Math.ceil((r+1)/scale)),
    ey:Math.min(H,Math.ceil((b+1)/scale)),
    recovered:!!(gl||gr||gt||gb)
  };
}

function rebuildRecoveredSource(i){
  const pc=pieces[i],img=pc.sourceImg;
  if(!img)return;

  // Replacement window: always re-sample directly from the ORIGINAL uploaded sheet.
  // recoverX/Y moves the entire source window; recoverGrow expands it equally
  // around the original split so missing artwork can be brought back.
  const growX=Math.round(pc.sourceW*(pc.recoverGrow||0)/100);
  const growY=Math.round(pc.sourceH*(pc.recoverGrow||0)/100);
  const targetW=Math.min(img.naturalWidth,pc.sourceW+growX*2);
  const targetH=Math.min(img.naturalHeight,pc.sourceH+growY*2);

  let centerX=pc.sourceX+pc.sourceW/2+(pc.recoverX||0);
  let centerY=pc.sourceY+pc.sourceH/2+(pc.recoverY||0);

  let sx=Math.round(centerX-targetW/2);
  let sy=Math.round(centerY-targetH/2);

  // Keep the complete replacement window on the original sheet.
  sx=Math.max(0,Math.min(img.naturalWidth-targetW,sx));
  sy=Math.max(0,Math.min(img.naturalHeight-targetH,sy));

  const c=document.createElement('canvas');
  c.width=targetW;c.height=targetH;
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,targetW,targetH);
  ctx.drawImage(img,sx,sy,targetW,targetH,0,0,targetW,targetH);

  // This REPLACES the letter crop, rather than moving the already-cropped bitmap.
  pc.original=c;
  pc.cropL=pc.cropR=pc.cropT=pc.cropB=0;
  pc.base=document.createElement('canvas');
  pc.base.width=targetW;pc.base.height=targetH;
  pc.base.getContext('2d').drawImage(c,0,0);

  renderPiece(i);

  const card=document.querySelector(`[data-preview="${i}"]`)?.closest('.card');
  if(card){
    card.querySelectorAll('input[data-crop-key]').forEach(r=>{
      r.value=0;
      const v=r.parentElement.querySelector('.value');
      if(v)v.textContent='0%';
    });
    const dims=card.querySelector('.note');
    if(dims)dims.textContent=`${targetW} × ${targetH}px`;
  }
}

function applyEdgeCrop(i){
  const pc=pieces[i],src=pc.original;
  const l=Math.round(src.width*(pc.cropL||0)/100),r=Math.round(src.width*(pc.cropR||0)/100);
  const t=Math.round(src.height*(pc.cropT||0)/100),b=Math.round(src.height*(pc.cropB||0)/100);
  const w=Math.max(1,src.width-l-r),h=Math.max(1,src.height-t-b);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(src,l,t,w,h,0,0,w,h);
  pc.base=c;
  renderPiece(i);
  const card=document.querySelector(`[data-preview="${i}"]`)?.closest('.card');
  const dims=card?.querySelector('.note');
  if(dims)dims.textContent=`${w} × ${h}px`;
}

function renderPiece(i){
  const pc=pieces[i],base=pc.base;
  let can=document.createElement('canvas');can.width=base.width;can.height=base.height;
  let ctx=can.getContext('2d');ctx.clearRect(0,0,can.width,can.height);
  const scale=pc.zoom/100,dw=base.width*scale,dh=base.height*scale,
        dx=(can.width-dw)/2+pc.x,dy=(can.height-dh)/2+pc.y;
  ctx.drawImage(base,dx,dy,dw,dh);pc.canvas=can;
  const preview=document.querySelector(`[data-preview="${i}"]`);
  if(preview) preview.src=can.toDataURL('image/png');
}

function card(i,w,h){
  const pc=pieces[i];
  let d=document.createElement('div');d.className='card';
  let p=document.createElement('div');p.className='preview';
  let im=document.createElement('img');im.dataset.preview=i;im.src=pc.canvas.toDataURL('image/png');p.appendChild(im);
  let info=document.createElement('div');info.className='info';
  let title=document.createElement('b');title.textContent=pc.letter;
  let dims=document.createElement('div');dims.className='note';dims.textContent=`${w} × ${h}px`;
  info.append(title,dims);
  if(pc.autoRecovered){
    let badge=document.createElement('div');badge.className='note';
    badge.style.cssText='font-weight:800;color:#008b8b;margin-top:3px';
    badge.textContent='✓ Full-letter edge recovery applied';
    info.appendChild(badge);
  }
  let adjust=document.createElement('div');adjust.className='adjust';

  let nameLab=document.createElement('label');nameLab.textContent='Rename';
  let name=document.createElement('input');name.type='text';name.value=pc.name.replace(/\.png$/i,'');
  name.dataset.autoClear='1';
  name.addEventListener('focus',()=>{
    if(name.dataset.autoClear==='1'){
      name.value='';
      name.dataset.autoClear='0';
      pc.name=`Piece-${i+1}.png`;
    }
  });
  name.addEventListener('input',()=>{
    name.dataset.autoClear='0';
    pc.name=(name.value.trim()||`Piece-${i+1}`)+'.png'
  });
  nameLab.appendChild(name);adjust.appendChild(nameLab);

  let recoverTitle=document.createElement('div');recoverTitle.className='note';recoverTitle.style.cssText='font-weight:800;margin-top:8px;color:#222';recoverTitle.textContent='Replace / Recover Full Letter';
  adjust.appendChild(recoverTitle);
  adjust.appendChild(makeRecoverSlider(i,'Widen Replacement','recoverGrow',0,100,0,'%'));
  adjust.appendChild(makeRecoverSlider(i,'Replace From Left / Right','recoverX',-Math.max(300,w*2),Math.max(300,w*2),0,'px'));
  adjust.appendChild(makeRecoverSlider(i,'Replace From Up / Down','recoverY',-Math.max(300,h*2),Math.max(300,h*2),0,'px'));

  let recoverButtons=document.createElement('div');
  recoverButtons.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0';
  [['← Replace Left','recoverX',-1],['Replace Right →','recoverX',1],['↑ Replace Up','recoverY',-1],['Replace Down ↓','recoverY',1]].forEach(([label,key,dir])=>{
    const btn=document.createElement('button');btn.type='button';btn.className='reset';btn.textContent=label;
    btn.onclick=()=>{
      const step=(key==='recoverX'?pc.sourceW:pc.sourceH)*.08;
      pc[key]=(pc[key]||0)+dir*step;
      const slider=adjust.querySelector(`input[data-recover-key="${key}"]`);
      if(slider){
        pc[key]=Math.max(+slider.min,Math.min(+slider.max,pc[key]));
        slider.value=pc[key];
        slider.parentElement.querySelector('.value').textContent=Math.round(pc[key])+'px';
      }
      rebuildRecoveredSource(i);
    };
    recoverButtons.appendChild(btn);
  });
  adjust.appendChild(recoverButtons);

  let cropTitle=document.createElement('div');cropTitle.className='note';cropTitle.style.cssText='font-weight:800;margin-top:8px;color:#222';cropTitle.textContent='Clean Up Edges';
  adjust.appendChild(cropTitle);
  adjust.appendChild(makeCropSlider(i,'Left Edge','cropL',0,45,0));
  adjust.appendChild(makeCropSlider(i,'Right Edge','cropR',0,45,0));
  adjust.appendChild(makeCropSlider(i,'Top Edge','cropT',0,45,0));
  adjust.appendChild(makeCropSlider(i,'Bottom Edge','cropB',0,45,0));
  adjust.appendChild(makeSlider(i,'Left / Right','x',-Math.max(100,w),Math.max(100,w),1,0,'px'));
  adjust.appendChild(makeSlider(i,'Up / Down','y',-Math.max(100,h),Math.max(100,h),1,0,'px'));
  adjust.appendChild(makeSlider(i,'Zoom','zoom',25,300,1,100,'%'));

  let reset=document.createElement('button');reset.type='button';reset.className='reset';reset.textContent='Reset This Letter';
  reset.onclick=()=>{
    pc.x=0;pc.y=0;pc.zoom=100;pc.cropL=pc.cropR=pc.cropT=pc.cropB=0;pc.recoverX=pc.recoverY=pc.recoverGrow=0;
    let resetOriginal=document.createElement('canvas');resetOriginal.width=pc.sourceW;resetOriginal.height=pc.sourceH;
    resetOriginal.getContext('2d').drawImage(pc.sourceImg,pc.sourceX,pc.sourceY,pc.sourceW,pc.sourceH,0,0,pc.sourceW,pc.sourceH);
    pc.original=resetOriginal;pc.base=document.createElement('canvas');pc.base.width=pc.sourceW;pc.base.height=pc.sourceH;pc.base.getContext('2d').drawImage(resetOriginal,0,0);
    adjust.querySelectorAll('input[type=range]').forEach(r=>{
      const key=r.dataset.key,cropKey=r.dataset.cropKey,recoverKey=r.dataset.recoverKey;
      if(cropKey){r.value=0;r.parentElement.querySelector('.value').textContent='0%';}
      else if(recoverKey){r.value=0;r.parentElement.querySelector('.value').textContent='0'+(recoverKey==='recoverGrow'?'%':'px');}
      else if(key){r.value=pc[key];r.parentElement.querySelector('.value').textContent=r.value+(key==='zoom'?'%':'px');}
    });renderPiece(i)
  };
  adjust.appendChild(reset);
  let b=document.createElement('button');b.className='pink';b.textContent='Download PNG';b.onclick=()=>dl(i);
  info.append(adjust,b);d.append(p,info);results.appendChild(d)
}

function makeRecoverSlider(i,label,key,min,max,value,unit){
  let lab=document.createElement('label'),txt=document.createElement('span'),val=document.createElement('span'),r=document.createElement('input');
  txt.textContent=label;val.className='value';val.textContent=value+unit;
  r.type='range';r.min=min;r.max=max;r.step=key==='recoverGrow'?1:1;r.value=value;r.dataset.recoverKey=key;
  r.addEventListener('input',()=>{
    pieces[i][key]=+r.value;val.textContent=r.value+unit;rebuildRecoveredSource(i);
  });
  lab.append(txt,val,r);return lab;
}

function makeCropSlider(i,label,key,min,max,value){
  let lab=document.createElement('label'),txt=document.createElement('span'),val=document.createElement('span'),r=document.createElement('input');
  txt.textContent=label;val.className='value';val.textContent=value+'%';
  r.type='range';r.min=min;r.max=max;r.step=.5;r.value=value;r.dataset.cropKey=key;
  r.addEventListener('input',()=>{
    const pc=pieces[i],v=+r.value;
    const opposite=key==='cropL'?'cropR':key==='cropR'?'cropL':key==='cropT'?'cropB':'cropT';
    if(v+(pc[opposite]||0)>90){r.value=90-(pc[opposite]||0)}
    pc[key]=+r.value;val.textContent=r.value+'%';applyEdgeCrop(i);
  });
  lab.append(txt,val,r);return lab;
}

function makeSlider(i,label,key,min,max,step,value,unit){
  let lab=document.createElement('label'),txt=document.createElement('span'),val=document.createElement('span'),r=document.createElement('input');
  txt.textContent=label;val.className='value';val.textContent=value+unit;
  r.type='range';r.min=min;r.max=max;r.step=step;r.value=value;r.dataset.key=key;
  r.addEventListener('input',()=>{pieces[i][key]=+r.value;val.textContent=r.value+unit;renderPiece(i)});
  lab.append(txt,val,r);return lab
}


function alphaBounds(canvas){
  const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  const data=ctx.getImageData(0,0,w,h).data;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      if(data[(y*w+x)*4+3]>12){
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return null;
  return {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
}

function autoAlignAndSize(){
  if(!pieces.length){status.textContent='Split your images first.';return}
  const bounds=pieces.map(p=>alphaBounds(p.base));
  const valid=bounds.filter(Boolean);
  if(!valid.length){status.textContent='No visible artwork detected.';return}

  // Normalize visible artwork to roughly 78% of each output cell.
  const targetFill=.78;
  pieces.forEach((pc,i)=>{
    const b=bounds[i];
    if(!b)return;
    const cw=pc.base.width,ch=pc.base.height;
    const scale=Math.min((cw*targetFill)/b.w,(ch*targetFill)/b.h);
    pc.zoom=Math.max(25,Math.min(300,scale*100));

    // renderPiece scales the whole base around its center. Calculate offsets
    // needed to put the visible alpha bounds at the exact output center.
    const s=pc.zoom/100;
    const baseCenterX=cw/2,baseCenterY=ch/2;
    const artCenterX=b.x+b.w/2,artCenterY=b.y+b.h/2;
    pc.x=(baseCenterX-artCenterX)*s;
    pc.y=(baseCenterY-artCenterY)*s;

    renderPiece(i);

    const card=document.querySelector(`[data-preview="${i}"]`)?.closest('.card');
    if(card){
      card.querySelectorAll('input[type=range]').forEach(r=>{
        const key=r.dataset.key;
        if(key && key in pc){
          r.value=pc[key];
          const v=r.parentElement.querySelector('.value');
          if(v)v.textContent=Math.round(pc[key])+(key==='zoom'?'%':'px');
        }
      });
    }
  });
  status.textContent=`Auto-aligned and sized ${valid.length} piece${valid.length===1?'':'s'}. You can still fine-tune each one manually.`;
}


function make5000Canvas(i){
  const src=pieces[i].canvas;
  const out=document.createElement('canvas');
  out.width=5000;out.height=5000;
  const ctx=out.getContext('2d');
  ctx.clearRect(0,0,5000,5000);
  // Preserve the complete adjusted piece and fit it proportionally inside the square.
  const scale=Math.min(5000/src.width,5000/src.height);
  const dw=src.width*scale,dh=src.height*scale;
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(src,(5000-dw)/2,(5000-dh)/2,dw,dh);
  return out;
}

function setPngDpi(blob,dpi=500){
  return blob.arrayBuffer().then(buf=>{
    const bytes=new Uint8Array(buf);
    // PNG pHYs uses pixels per meter. 500 DPI ~= 19685 ppm.
    const ppm=Math.round(dpi/0.0254);
    const data=new Uint8Array(9);
    const dv=new DataView(data.buffer);
    dv.setUint32(0,ppm,false);dv.setUint32(4,ppm,false);data[8]=1;

    const type=new TextEncoder().encode('pHYs');
    const crcInput=new Uint8Array(13);
    crcInput.set(type,0);crcInput.set(data,4);

    function crc32(arr){
      let c=0xffffffff;
      for(let n=0;n<arr.length;n++){
        c^=arr[n];
        for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);
      }
      return (c^0xffffffff)>>>0;
    }

    const chunk=new Uint8Array(4+4+9+4);
    const cdv=new DataView(chunk.buffer);
    cdv.setUint32(0,9,false);
    chunk.set(type,4);
    chunk.set(data,8);
    cdv.setUint32(17,crc32(crcInput),false);

    // Insert pHYs after IHDR: signature 8 + IHDR chunk 25 = byte 33.
    const out=new Uint8Array(bytes.length+chunk.length);
    out.set(bytes.slice(0,33),0);
    out.set(chunk,33);
    out.set(bytes.slice(33),33+chunk.length);
    return new Blob([out],{type:'image/png'});
  });
}

function exportBlob(i){
  const out=make5000Canvas(i);
  return new Promise(resolve=>out.toBlob(resolve,'image/png')).then(blob=>setPngDpi(blob,500));
}

async function dl(i){
  const blob=await exportBlob(i);
  let u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=pieces[i].name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000)
}

$('autoAlign').onclick=autoAlignAndSize;

all.onclick=async()=>{
  if(!pieces.length){status.textContent='Nothing to download yet.';return}
  if(typeof JSZip==='undefined'){
    status.textContent='ZIP download could not load. Check your internet connection and try again.';
    return;
  }
  all.disabled=true;
  const oldText=all.textContent;
  all.textContent='Making ZIP…';
  status.textContent=`Preparing ${pieces.length} PNGs in one ZIP file…`;
  try{
    const zip=new JSZip();
    for(let i=0;i<pieces.length;i++){
      const blob=await exportBlob(i);
      let name=pieces[i].name || `Piece-${i+1}.png`;
      zip.file(name,blob);
    }
    const zipBlob=await zip.generateAsync({type:'blob'});
    const u=URL.createObjectURL(zipBlob),a=document.createElement('a');
    a.href=u;
    let zipName=($('zipName').value||'alpha-splitter').trim()
      .replace(/\.zip$/i,'')
      .replace(/[\\/:*?"<>|]+/g,'-')
      .replace(/\s+/g,' ')
      .trim() || 'alpha-splitter';
    a.download=zipName+'.zip';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1500);
    status.textContent=`Downloaded ${pieces.length} PNGs as one ZIP file.`;
  }catch(err){
    console.error(err);
    status.textContent='Could not create the ZIP. Please try again.';
  }finally{
    all.disabled=false;
    all.textContent=oldText;
  }
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
